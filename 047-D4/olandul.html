<!DOCTYPE html>
<html>
<head>
<title>Lists</title>

<style>
ol {
    list-style-type: upper-roman;
}

ul {
    list-style-type: square;
}
</style>

</head>
<body>

<h2>Ordered List</h2>
<ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>

<h2>Unordered List</h2>
<ul>
    <li>Java</li>
    <li>Python</li>
    <li>C</li>
</ul>
<script src="vote.js"></script>

<form method="get">
    <lable for="name"> First Name</lable>
    <input type="text" id="name" name="name"><br><br>
    <label for="lname">Last Nmae</label>
    <input type="text" id="lname" name="lname"><br><br>
    <label for="email">Email</label>
    <input type="email" id="email" name="email"><br><br>
    <label for="gender">Gender</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone"><br><br>
    <label for="city">City</label>
    <input type="text" id="city" name="city"><br><br>

    <label for="lang">Language</label>
    <input type="checkbox" name="lang" value="Java">
    <label for="Java">Java</label>
    <input type="checkbox" name="lang" value="Python">
    <label for="Python">Python</label>
    <input type="checkbox" name="lang" value="C">
    <label for="C">C</label><br><br>
    <label="button">Submit</label>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</form>
</body>
</html>
