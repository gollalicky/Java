<!DOCTYPE html>
<html>
<head>
<style>
.a { list-style-type: disc; }
.b { list-style-type: circle; }
.c { list-style-type: square; }
.d { list-style-type: none; }
</style>
</head>
<body>

<h2>Unordered List Formats</h2>

<p>1. Disc</p>
<ul class="a">
<li>Apple</li><li>Banana</li>
</ul>

<p>2. Circle</p>
<ul class="b">
<li>Apple</li><li>Banana</li>
</ul>

<p>3. Square</p>
<ul class="c">
<li>Apple</li><li>Banana</li>
</ul>

<p>4. None</p>
<ul class="d">
<li>Apple</li><li>Banana</li>
</ul>

</body>
  
</html>
